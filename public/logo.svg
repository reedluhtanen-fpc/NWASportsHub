<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b1a"/>
      <stop offset="100%" style="stop-color:#276845"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a85a"/>
      <stop offset="100%" style="stop-color:#6dcf90"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="192" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="#34a85a" stroke-width="6"/>

  <!-- Inner ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#34a85a" stroke-width="2" opacity="0.5"/>

  <!-- Baseball diamond shape (rotated square) -->
  <polygon points="200,80 310,190 200,300 90,190" fill="none" stroke="#6dcf90" stroke-width="3" opacity="0.25"/>

  <!-- Baseball stitching arcs on the left -->
  <path d="M 126,148 Q 108,170 108,190 Q 108,210 126,232" fill="none" stroke="#6dcf90" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M 136,152 Q 120,172 120,190 Q 120,208 136,228" fill="none" stroke="#6dcf90" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>

  <!-- Baseball stitching arcs on the right -->
  <path d="M 274,148 Q 292,170 292,190 Q 292,210 274,232" fill="none" stroke="#6dcf90" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M 264,152 Q 280,172 280,190 Q 280,208 264,228" fill="none" stroke="#6dcf90" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>

  <!-- NWA text -->
  <text x="200" y="210"
    font-family="Arial Black, Impact, sans-serif"
    font-size="108"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2">NWA</text>

  <!-- Green underline bar -->
  <rect x="72" y="222" width="256" height="5" rx="2.5" fill="url(#accentGrad)"/>

  <!-- SPORTS HUB text -->
  <text x="200" y="268"
    font-family="Arial, sans-serif"
    font-size="36"
    font-weight="700"
    fill="#6dcf90"
    text-anchor="middle"
    letter-spacing="8">SPORTS HUB</text>

  <!-- Bottom tagline -->
  <text x="200" y="312"
    font-family="Arial, sans-serif"
    font-size="18"
    fill="#6dcf90"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.7">NORTHWEST ARKANSAS</text>
</svg>
