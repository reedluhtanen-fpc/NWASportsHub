<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b1a"/>
      <stop offset="100%" style="stop-color:#276845"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34a85a"/>
      <stop offset="100%" style="stop-color:#6dcf90"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle diamond watermark -->
  <polygon points="400,120 620,340 400,560 180,340" fill="none" stroke="#6dcf90" stroke-width="4" opacity="0.15"/>

  <!-- Baseball stitching left -->
  <path d="M 210,270 Q 185,310 185,350 Q 185,390 210,430" fill="none" stroke="#6dcf90" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <path d="M 230,278 Q 208,315 208,350 Q 208,385 230,422" fill="none" stroke="#6dcf90" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>

  <!-- Baseball stitching right -->
  <path d="M 590,270 Q 615,310 615,350 Q 615,390 590,430" fill="none" stroke="#6dcf90" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <path d="M 570,278 Q 592,315 592,350 Q 592,385 570,422" fill="none" stroke="#6dcf90" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>

  <!-- NWA text -->
  <text x="400" y="410"
    font-family="Arial Black, Impact, sans-serif"
    font-size="230"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-4">NWA</text>

  <!-- Green underline -->
  <rect x="120" y="428" width="560" height="8" rx="4" fill="url(#accentGrad)"/>

  <!-- SPORTS HUB -->
  <text x="400" y="510"
    font-family="Arial, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#6dcf90"
    text-anchor="middle"
    letter-spacing="16">SPORTS HUB</text>

  <!-- Tagline -->
  <text x="400" y="575"
    font-family="Arial, sans-serif"
    font-size="32"
    fill="#6dcf90"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.65">NORTHWEST ARKANSAS</text>
</svg>
